<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · AI Operations Assistant</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f1;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1d2320; }
  form { background: #fff; border: 1px solid #e3e1da; border-radius: 12px; padding: 28px; width: 320px; }
  h1 { font-size: 18px; margin: 0 0 4px; } p { color: #66706b; font-size: 14px; margin: 0 0 18px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #e3e1da; border-radius: 8px; font: inherit; }
  button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #1f6f54; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .error { color: #a1271d; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<form method="post">
  <h1>AI Operations Assistant</h1>
  {% if not disabled %}
  <p>Enter the password to continue.</p>
  <input type="password" name="password" autofocus placeholder="Password">
  <button type="submit">Sign in</button>
  {% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</form>
</body>
</html>
